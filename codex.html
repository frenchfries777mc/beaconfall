<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://frenchfries777mc.github.io/games/ff-lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEACONFALL · 도감</title>
<meta name="theme-color" content="#14527e">
<style>
@font-face{font-family:Galmuri;src:url(Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Galmuri;src:url(Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--ink:#0b1626;--cream:#f4ecd0;--gold:#e9d9a4;--sky:#9ae0ff;--btn:rgba(14,18,30,.78);--panel:rgba(10,16,28,.86)}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{margin:0;color:var(--cream);font-family:Galmuri,'Noto Sans KR','Hiragino Sans','Malgun Gothic',monospace;font-size:15px;line-height:1.6}
body{background:linear-gradient(180deg,rgba(6,16,30,.55),rgba(6,16,30,.9)),url(shot-camp.png) center/cover fixed;min-height:100vh}
img{image-rendering:pixelated;image-rendering:crisp-edges}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.pb{display:inline-block;padding:8px 14px;border:3px solid var(--gold);border-radius:0;background:var(--btn);color:var(--cream);font:700 14px/1.2 inherit;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 #000b;text-align:center}
.pb:hover,.pb.on{background:var(--gold);color:#10141f}
.pb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000b}
.row{display:flex;flex-wrap:wrap;gap:8px}
.top{padding:12px 0 6px}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.top .pb{padding:6px 10px;font-size:13px;border-width:2px;box-shadow:3px 3px 0 #000b}
h1{margin:18px 0 4px;font-size:clamp(30px,7vw,52px);letter-spacing:.06em;line-height:1.1;text-shadow:4px 4px 0 #000}
.sub{margin:0 0 16px;color:var(--gold);font-size:13px;text-shadow:2px 2px 0 #000}
.tabs{margin:6px 0 14px}
.tabs .pb{border-color:var(--sky)}
.tabs .pb.on{background:var(--sky)}
input.q{width:100%;padding:10px 12px;border:3px solid var(--gold);background:var(--panel);color:var(--cream);font:15px inherit;box-shadow:4px 4px 0 #000b;outline:none;margin:0 0 12px}
.cats{margin:0 0 14px}
.cats .pb{padding:5px 9px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 #000b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:2px solid #e9d9a466;background:var(--panel);cursor:pointer;font-size:12px;text-align:center;line-height:1.3;color:var(--cream)}
.card:hover{border-color:var(--gold)}
.card img{width:40px;height:40px}
.cnt{color:var(--gold);font-size:12px;margin:0 0 8px;text-shadow:2px 2px 0 #000}
/* 레시피 */
.grp{margin:18px 0 6px;font-size:16px;text-shadow:2px 2px 0 #000;color:var(--gold)}
.rc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border:2px solid #e9d9a444;background:var(--panel);margin:0 0 6px}
.rc .res{display:flex;align-items:center;gap:6px;min-width:140px;cursor:pointer;font-weight:700}
.rc .res img{width:28px;height:28px}
.slots{display:flex;gap:3px;flex-wrap:wrap}
.sl{position:relative;width:30px;height:30px;border:2px solid #00000088;background:#e9d9a41f;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sl img{width:22px;height:22px}
.sl b{position:absolute;right:1px;bottom:-2px;font-size:10px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.sl.e{cursor:default;opacity:.45}
.wh{font-size:11px;padding:2px 6px;border:1px solid var(--sky);color:var(--sky);white-space:nowrap}
.wh.bk{border-color:#ffb0d0;color:#ffb0d0}
.rn{flex-basis:100%;font-size:12px;color:#d9cfb0;margin-top:-2px}
/* 공략 */
.gl{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.gl li{background:var(--panel);border-left:4px solid var(--gold);padding:8px 12px}
/* 상세 */
#det{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px}
#det.on{display:flex}
#det .box{width:min(640px,100%);background:#141c2c;border:3px solid var(--gold);box-shadow:6px 6px 0 #000;padding:16px 16px 18px;position:relative}
#det .x{position:absolute;right:10px;top:10px}
.dh{display:flex;align-items:center;gap:12px;margin:0 40px 10px 0}
.dh img{width:64px;height:64px;background:#e9d9a41a;border:2px solid #e9d9a444}
.dh h2{margin:0;font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tags span{font-size:12px;padding:2px 8px;border:1px solid var(--gold);color:var(--gold)}
.sec{margin:14px 0 6px;font-size:14px;color:var(--sky)}
.src{font-size:13px;margin:0 0 6px;padding:6px 10px;background:#ffffff0d}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses .card{width:86px}
.none{font-size:13px;opacity:.7}
footer{padding:40px 0 30px;color:var(--gold);font-size:12px;text-shadow:2px 2px 0 #000}
</style>
</head>
<body>
<div class="top"><div class="wrap">
 <a class="pb" href="index.html" data-t="home"></a>
 <div class="row" id="lg"></div>
 <span data-ff-account></span>
</div></div>
<div class="wrap">
 <h1 data-t="title"></h1>
 <p class="sub" data-t="sub"></p>
 <div class="row tabs" id="tabs">
  <button class="pb" data-tab="items" data-t="t_items"></button>
  <button class="pb" data-tab="recipes" data-t="t_recipes"></button>
  <button class="pb" data-tab="guide" data-t="t_guide"></button>
 </div>
 <div id="v_items">
  <input class="q" id="qi" autocomplete="off">
  <div class="row cats" id="cats"></div>
  <div class="cnt" id="icnt"></div>
  <div class="grid" id="igrid"></div>
 </div>
 <div id="v_recipes" hidden>
  <input class="q" id="qr" autocomplete="off">
  <div id="rlist"></div>
 </div>
 <div id="v_guide" hidden>
  <div class="row" id="gcats"></div>
  <ul class="gl" id="gtips"></ul>
 </div>
 <footer>BEACONFALL · <span data-t="foot"></span></footer>
</div>
<div id="det"><div class="box" id="dbox"></div></div>
<script src="i18n.js"></script>
<script src="codex-data.js"></script>
<script>
const C=window.CODEX,I=window.I18N,LS=['ko','en','fr','de','es','ja'];
const NAMES={ko:'한국어',en:'English',fr:'Français',de:'Deutsch',es:'Español',ja:'日本語'};
const T={
 home:['← 홈','← Home','← Accueil','← Start','← Inicio','← ホーム'],
 title:['도감','Codex','Encyclopédie','Lexikon','Enciclopedia','図鑑'],
 sub:['모든 아이템, 레시피, 공략을 한곳에서 찾아보세요','Every item, recipe and tip in one place','Tous les objets, recettes et astuces au même endroit','Alle Gegenstände, Rezepte und Tipps an einem Ort','Todos los objetos, recetas y consejos en un solo lugar','すべてのアイテム・レシピ・攻略をひとまとめに'],
 t_items:['아이템','Items','Objets','Gegenstände','Objetos','アイテム'],
 t_recipes:['레시피','Recipes','Recettes','Rezepte','Recetas','レシピ'],
 t_guide:['공략','Guide','Guide','Guide','Guía','攻略'],
 q_items:['아이템 이름으로 찾기','Search items by name','Chercher un objet','Gegenstand suchen','Buscar objeto','アイテム名で検索'],
 q_recipes:['결과물이나 재료 이름으로 찾기','Search by result or ingredient','Chercher par résultat ou ingrédient','Nach Ergebnis oder Zutat suchen','Buscar por resultado o ingrediente','完成品か材料の名前で検索'],
 count:['{n}개','{n} items','{n} objets','{n} Gegenstände','{n} objetos','{n}個'],
 c_all:['전체','All','Tout','Alle','Todo','すべて'],
 c_mat:['재료','Materials','Matériaux','Materialien','Materiales','素材'],
 c_tool:['도구·무기','Tools & weapons','Outils et armes','Werkzeuge & Waffen','Herramientas y armas','道具・武器'],
 c_armor:['갑옷','Armor','Armures','Rüstung','Armadura','防具'],
 c_build:['설치·건축','Placeable','À poser','Platzierbar','Colocables','設置・建築'],
 c_food:['음식','Food','Nourriture','Essen','Comida','食べ物'],
 c_fish:['물고기','Fish','Poissons','Fische','Peces','魚'],
 c_pot:['물약·룬','Potions & runes','Potions et runes','Tränke & Runen','Pociones y runas','ポーション・ルーン'],
 make:['만드는 법','How to make','Fabrication','Herstellung','Cómo fabricar','作り方'],
 get:['얻는 곳','Where to get','Où l\'obtenir','Fundort','Dónde conseguir','入手方法'],
 uses:['재료로 쓰이는 곳','Used to make','Sert à fabriquer','Wird verwendet für','Se usa para','材料として使う'],
 none_get:['채집하거나 몬스터·상자에서 얻어요','Gathered, or dropped by monsters and chests','Récolté, ou obtenu des monstres et coffres','Gesammelt oder von Monstern und Truhen','Se recolecta o lo sueltan monstruos y cofres','採集、またはモンスターや宝箱から入手'],
 none_use:['다른 레시피에 쓰이지 않아요','Not used in other recipes','Utilisé dans aucune recette','In keinem Rezept verwendet','No se usa en otras recetas','他のレシピには使いません'],
 tg_place:['설치 가능','Placeable','À poser','Platzierbar','Colocable','設置できる'],
 tg_dur:['내구도 {n}','Durability {n}','Durabilité {n}','Haltbarkeit {n}','Durabilidad {n}','耐久度 {n}'],
 tg_max:['최대 {n}개','Stacks to {n}','Max {n}','Stapel {n}','Máx. {n}','最大 {n}個'],
 tg_food:['체력 +{n}','Heals {n}','Soigne {n}','Heilt {n}','Cura {n}','体力 +{n}'],
 s_fish_sea:['바다 낚시','Sea fishing','Pêche en mer','Meeresangeln','Pesca en el mar','海釣り'],
 s_fish_river:['강 낚시','River fishing','Pêche en rivière','Flussangeln','Pesca en el río','川釣り'],
 s_mob:['몬스터: {s}','Monster: {s}','Monstre : {s}','Monster: {s}','Monstruo: {s}','モンスター: {s}'],
 s_boss:['보스: {s}','Boss: {s}','Boss : {s}','Boss: {s}','Jefe: {s}','ボス: {s}'],
 s_loot:['보물 상자','Treasure chests','Coffres au trésor','Schatztruhen','Cofres del tesoro','宝箱'],
 s_shop:['마을 상점 · {n}개 {p}동전','Village shop · {n} for {p} coins','Boutique du village · {n} pour {p} pièces','Dorfladen · {n} für {p} Münzen','Tienda del pueblo · {n} por {p} monedas','村の店・{n}個 {p}コイン'],
 s_crop:['밭에 심어 수확 ({s})','Grow on farmland ({s})','Cultiver sur une terre ({s})','Auf dem Acker anbauen ({s})','Cultivar en tierra ({s})','畑で栽培 ({s})'],
 s_alch:['연금술대: {s}','Alchemy table: {s}','Table d\'alchimie : {s}','Alchemietisch: {s}','Mesa de alquimia: {s}','錬金台: {s}'],
 s_armor:['갑옷 작업대: {s} {n}개 (두드려 만든 품질에 따라 ★1~3)','Armor bench: {n} {s} (★1–3 by forging quality)','Établi d\'armure : {n} {s} (★1–3 selon la forge)','Rüstungswerkbank: {n} {s} (★1–3 je nach Schmiedequalität)','Banco de armaduras: {n} {s} (★1–3 según la forja)','防具台: {s} {n}個 (鍛えた品質で★1〜3)'],
 s_book:['📕 {s} 필요','📕 Needs {s}','📕 Nécessite {s}','📕 Benötigt {s}','📕 Requiere {s}','📕 {s} が必要'],
 tool:['도구 필요: {s}','Needs tool: {s}','Outil requis : {s}','Werkzeug nötig: {s}','Requiere: {s}','必要な道具: {s}'],
 foot:['게임 데이터에서 그대로 가져온 도감이에요','Built straight from the game data','Généré à partir des données du jeu','Direkt aus den Spieldaten erstellt','Generado con los datos del juego','ゲームのデータから作った図鑑です']
};
const KEY='beaconfallSiteLang';
function pick(){let s=null;try{s=localStorage.getItem(KEY);}catch(e){}
 if(s&&LS.includes(s))return s;
 for(const x of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'ko'])){const b=String(x).toLowerCase().split('-')[0];if(LS.includes(b))return b;}
 return 'en';}
let LANG=pick();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(k,v)=>{let s=(T[k]&&(T[k][LS.indexOf(LANG)]||T[k][0]))||k;if(v)for(const q in v)s=s.split('{'+q+'}').join(v[q]);return s;};
const tr=s=>!s?'':LANG==='ko'?s:((C.tr[s]&&C.tr[s][LANG])||s);
const nm=id=>C.items[id]?tr(C.items[id].n):id;
const ic=id=>C.items[id]?C.items[id].ic:'';
const IDS=Object.keys(C.items);
const FISH=new Map(C.fish),LOOT=new Set(C.loot),ALCH=new Map(C.alch.map(a=>[a.id,a.ing]));
const POTS=new Set(C.alch.map(a=>a.id));
function cat(id){
 const it=C.items[id];
 if(id.startsWith('ar_'))return 'armor';
 if(FISH.has(id))return 'fish';
 if(POTS.has(id)||id.startsWith('rune_')||id.startsWith('pot_'))return 'pot';
 if(it.fd)return 'food';
 if(it.du)return 'tool';
 if(it.pl)return 'build';
 return 'mat';
}
const CATS=['all','mat','tool','armor','build','food','fish','pot'];
let CAT='all',TAB='items';
// 재료 → 레시피, 결과 → 레시피
const MADE={},USED={};
C.recipes.forEach((r,i)=>{
 r.o.forEach(([id])=>(MADE[id]=MADE[id]||[]).push(i));
 const seen=new Set();
 r.p.forEach(p=>{if(!p)return;const ids=Array.isArray(p)?[p[0]]:p.a;ids.forEach(id=>{if(!seen.has(id)){seen.add(id);(USED[id]=USED[id]||[]).push(i);}});});
});
for(const [id,ing] of ALCH)ing.forEach(x=>{(USED[x]=USED[x]||[]);});
function slotHTML(p){
 if(!p)return '<span class="sl e"></span>';
 const id=Array.isArray(p)?p[0]:p.a[0],n=Array.isArray(p)?p[1]:p.n,alt=Array.isArray(p)?nm(id):p.a.map(nm).join(' / ');
 return `<span class="sl" data-id="${esc(id)}" title="${esc(alt)}"><img src="${ic(id)}" alt=""><b>${n>1?n:''}</b></span>`;
}
function recipeHTML(i){
 const r=C.recipes[i],o=r.o[0];if(!o)return '';
 let last=r.p.length;while(last>0&&!r.p[last-1])last--;
 const slots=r.p.slice(0,Math.max(last,1)).map(slotHTML).join('');
 const outs=r.o.map(([id,n])=>`<span class="res" data-id="${esc(id)}"><img src="${ic(id)}" alt="">${esc(nm(id))}${n>1?' ×'+n:''}</span>`).join('');
 const note=[r.t?tr(r.t):'',r.tl?t('tool',{s:nm(r.tl)}):''].filter(Boolean).join(' · ');
 return `<div class="rc">${outs}<span class="wh">${esc(tr(r.w))}</span>${r.bk?`<span class="wh bk">${esc(t('s_book',{s:tr(r.bk)}))}</span>`:''}<span class="slots">${slots}</span>${note?`<div class="rn">${esc(note)}</div>`:''}</div>`;
}
function card(id){return `<button class="card" data-id="${esc(id)}"><img src="${ic(id)}" alt="" loading="lazy">${esc(nm(id))}</button>`;}
function renderItems(){
 const q=document.getElementById('qi').value.trim().toLowerCase();
 const list=IDS.filter(id=>(CAT==='all'||cat(id)===CAT)&&(!q||nm(id).toLowerCase().includes(q)||C.items[id].n.includes(q)));
 document.getElementById('icnt').textContent=t('count',{n:list.length});
 document.getElementById('igrid').innerHTML=list.map(card).join('');
 document.getElementById('cats').innerHTML=CATS.map(c=>`<button class="pb${c===CAT?' on':''}" data-cat="${c}">${esc(t('c_'+c))}</button>`).join('');
}
function renderRecipes(){
 const q=document.getElementById('qr').value.trim().toLowerCase();
 const hit=r=>!q||r.o.some(([id])=>nm(id).toLowerCase().includes(q)||C.items[id]&&C.items[id].n.includes(q))||r.p.some(p=>p&&(Array.isArray(p)?[p[0]]:p.a).some(id=>nm(id).toLowerCase().includes(q)||(C.items[id]&&C.items[id].n.includes(q))));
 const groups=new Map();
 C.recipes.forEach((r,i)=>{if(!r.o.length||!hit(r))return;(groups.get(r.g)||groups.set(r.g,[]).get(r.g)).push(i);});
 let h='';for(const [g,arr] of groups)h+=`<div class="grp">${esc(tr(g))}</div>`+arr.map(recipeHTML).join('');
 document.getElementById('rlist').innerHTML=h||`<p class="none">—</p>`;
}
let GI=0;
function renderGuide(){
 const g=I.G||[];
 document.getElementById('gcats').innerHTML=g.map((x,i)=>`<button class="pb${i===GI?' on':''}" data-g="${i}">${esc(x.n[LANG]||x.n.ko)}</button>`).join('');
 document.getElementById('gtips').innerHTML=g[GI]?g[GI].i.map(x=>'<li>'+esc(x[LANG]||x.ko)+'</li>').join(''):'';
}
function sources(id){
 const out=[];
 const fh=FISH.get(id);if(fh)out.push(t(fh==='sea'?'s_fish_sea':'s_fish_river'));
 (C.gather[id]||[]).forEach(g=>out.push(tr(g)));
 for(const [mn,its,boss] of C.mobs)if(its.includes(id))out.push(t(boss?'s_boss':'s_mob',{s:tr(mn)}));
 if(LOOT.has(id))out.push(t('s_loot'));
 for(const [sid,n,p] of C.shops)if(sid===id)out.push(t('s_shop',{n,p}));
 for(const [seed,o] of C.crops)if(o===id||seed===id)out.push(t('s_crop',{s:nm(seed)}));
 if(ALCH.has(id))out.push(t('s_alch',{s:ALCH.get(id).map(nm).join(' + ')}));
 if(id.startsWith('ar_')){const [,pc,mat]=id.split('_');const P=C.armor.pieces.find(x=>x.k===pc);if(P)out.push(t('s_armor',{s:nm((C.armor.mi||{})[mat]||mat),n:P.n}));}
 return [...new Set(out)];
}
function openItem(id){
 const it=C.items[id];if(!it)return;
 const tags=[];if(it.pl)tags.push(t('tg_place'));if(it.du)tags.push(t('tg_dur',{n:it.du}));if(it.fd)tags.push(t('tg_food',{n:it.fd}));if(it.mx&&!it.du)tags.push(t('tg_max',{n:it.mx}));
 const made=(MADE[id]||[]).map(recipeHTML).join('');
 const src=sources(id).map(s=>`<div class="src">${esc(s)}</div>`).join('');
 const used=[...new Set((USED[id]||[]).flatMap(i=>C.recipes[i].o.map(o=>o[0])))];
 for(const [aid,ing] of ALCH)if(ing.includes(id)&&!used.includes(aid))used.push(aid);
 let h=`<button class="pb x" data-close>✕</button><div class="dh"><img src="${it.ic}" alt=""><h2>${esc(nm(id))}</h2></div>`;
 if(tags.length)h+=`<div class="tags">${tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
 if(made)h+=`<div class="sec">${esc(t('make'))}</div>${made}`;
 h+=`<div class="sec">${esc(t('get'))}</div>${src||(made?'':`<div class="none">${esc(t('none_get'))}</div>`)}`;
 if(!src&&made)h=h.replace(`<div class="sec">${esc(t('get'))}</div>`,'');
 h+=`<div class="sec">${esc(t('uses'))}</div>${used.length?`<div class="uses">${used.map(card).join('')}</div>`:`<div class="none">${esc(t('none_use'))}</div>`}`;
 document.getElementById('dbox').innerHTML=h;
 document.getElementById('det').classList.add('on');
 document.getElementById('det').scrollTop=0;
 if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
}
function closeItem(){document.getElementById('det').classList.remove('on');history.replaceState(null,'',location.pathname+(TAB!=='items'?'#'+TAB:''));}
function setTab(tb){
 TAB=tb;
 for(const k of ['items','recipes','guide'])document.getElementById('v_'+k).hidden=k!==tb;
 document.querySelectorAll('#tabs .pb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tb));
 if(tb==='recipes')renderRecipes();else if(tb==='guide')renderGuide();else renderItems();
}
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
 document.title='BEACONFALL · '+t('title');
 document.getElementById('qi').placeholder=t('q_items');document.getElementById('qr').placeholder=t('q_recipes');
 document.getElementById('lg').innerHTML=LS.map(l=>`<button class="pb${l===LANG?' on':''}" data-l="${l}">${NAMES[l]}</button>`).join('');
 setTab(TAB);
 const d=document.getElementById('det');if(d.classList.contains('on')){const id=decodeURIComponent(location.hash.slice(1));if(C.items[id])openItem(id);}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-l],[data-tab],[data-cat],[data-g],[data-id],[data-close],#det');if(!el)return;
 if(el.id==='det'){if(e.target===el)closeItem();return;}
 if(el.dataset.l){LANG=el.dataset.l;try{localStorage.setItem(KEY,LANG);if(window.FFLang)FFLang.set(LANG);}catch(x){}applyLang();return;}
 if(el.dataset.tab){setTab(el.dataset.tab);history.replaceState(null,'',el.dataset.tab==='items'?location.pathname:'#'+el.dataset.tab);return;}
 if(el.dataset.cat){CAT=el.dataset.cat;renderItems();return;}
 if(el.dataset.g){GI=+el.dataset.g;renderGuide();return;}
 if(el.hasAttribute('data-close')){closeItem();return;}
 if(el.dataset.id)openItem(el.dataset.id);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeItem();});
document.getElementById('qi').addEventListener('input',renderItems);
document.getElementById('qr').addEventListener('input',renderRecipes);
{const h=decodeURIComponent(location.hash.slice(1));if(h==='recipes'||h==='guide')TAB=h;applyLang();if(C.items[h])openItem(h);}
</script>
