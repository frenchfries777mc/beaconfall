<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://frenchfries777mc.github.io/games/ff-lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEACONFALL · 갤러리</title>
<meta name="description" content="BEACONFALL의 웅장한 풍경과 구조물 사진 모음">
<meta name="theme-color" content="#14527e">
<style>
@font-face{font-family:Galmuri;src:url(Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Galmuri;src:url(Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--ink:#0b1626;--cream:#f4ecd0;--gold:#e9d9a4;--sky:#9ae0ff;--btn:rgba(14,18,30,.78)}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{margin:0;color:var(--cream);font-family:Galmuri,'Noto Sans KR','Hiragino Sans','Malgun Gothic',monospace;font-size:15px;line-height:1.6}
body{background:linear-gradient(180deg,rgba(6,16,30,.5),rgba(6,16,30,.92)),url(gallery/whale.png) center/cover fixed;min-height:100vh}
img{image-rendering:pixelated;image-rendering:crisp-edges}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.pb{display:inline-block;padding:8px 14px;border:3px solid var(--gold);border-radius:0;background:var(--btn);color:var(--cream);font:700 14px/1.2 inherit;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 #000b;text-align:center}
.pb:hover,.pb.on{background:var(--gold);color:#10141f}
.pb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000b}
.top{padding:12px 0 6px}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.top .pb{padding:6px 10px;font-size:13px;border-width:2px;box-shadow:3px 3px 0 #000b}
.top .lg{display:flex;flex-wrap:wrap;gap:8px}
h1{margin:18px 0 4px;font-size:clamp(30px,7vw,52px);letter-spacing:.06em;line-height:1.1;text-shadow:4px 4px 0 #000}
.sub{margin:0 0 20px;color:var(--gold);font-size:13px;text-shadow:2px 2px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:28px}
.card{display:flex;flex-direction:column;padding:0;border:3px solid var(--gold);background:#000;box-shadow:5px 5px 0 #000b;cursor:pointer;color:var(--cream);font:inherit;text-align:left}
.card:hover{border-color:var(--sky)}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000b}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b1626}
.card .cap{display:block;padding:8px 10px 10px;background:rgba(10,16,28,.92)}
.card b{display:block;font-size:15px;text-shadow:2px 2px 0 #000}
.card small{display:block;margin-top:2px;font-size:12px;color:var(--gold);line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px}
footer{padding:10px 0 40px;font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #000}
/* 크게 보기 */
#lb{position:fixed;inset:0;z-index:50;background:rgba(3,8,16,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:calc(100vh - 150px);border:3px solid var(--gold);box-shadow:6px 6px 0 #000b;background:#000}
#lb .cp{max-width:900px;text-align:center;text-shadow:2px 2px 0 #000}
#lb .cp b{display:block;font-size:18px}
#lb .cp span{display:block;font-size:13px;color:var(--gold)}
#lb .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="top"><div class="wrap">
 <a class="pb" href="index.html" data-t="back"></a>
 <div class="lg" id="lg"></div>
</div></div>
<div class="wrap">
 <h1 data-t="title"></h1>
 <p class="sub" data-t="sub"></p>
 <div class="grid" id="grid"></div>
 <div class="row"><a class="pb" id="playBtn" href="index.html#play" data-t="play"></a></div>
 <footer data-t="foot"></footer>
</div>
<div id="lb" role="dialog" aria-modal="true">
 <img id="lbImg" alt="">
 <div class="cp"><b id="lbT"></b><span id="lbD"></span></div>
 <div class="bar"><button class="pb" id="lbPrev" data-t="prev"></button><button class="pb" id="lbNext" data-t="next"></button><button class="pb" id="lbClose" data-t="close"></button></div>
</div>
<script>
const G={"items": [{"id": "whale", "t": {"ko": ["바다의 고래", "깊은 바다를 천천히 가로지르다가 가끔 떠올라 물줄기를 뿜어요."], "en": ["Whale of the Sea", "It glides slowly through the deep sea and sometimes surfaces to spout water."], "fr": ["Baleine de la mer", "Elle traverse lentement les eaux profondes et remonte parfois pour souffler un jet d'eau."], "de": ["Wal im Meer", "Er gleitet langsam durch die Tiefsee und taucht manchmal auf, um Wasser zu spritzen."], "es": ["Ballena del mar", "Cruza despacio el mar profundo y a veces sale a la superficie para soltar un chorro de agua."], "ja": ["海のクジラ", "深い海をゆっくり泳ぎ、ときどき浮かび上がって潮を吹きます。"]}}, {"id": "temple", "t": {"ko": ["거대한 신전 유적", "높은 기둥 줄과 거인상, 제단이 있는 큰 섬의 신전이에요. 안쪽에 보물 상자가 숨어 있어요."], "en": ["Giant Temple Ruin", "A temple on a large island with rows of tall columns, colossus statues and an altar. A treasure chest hides inside."], "fr": ["Ruine de temple géant", "Un temple sur une grande île, avec des rangées de hautes colonnes, des statues colossales et un autel. Un coffre au trésor y est caché."], "de": ["Riesige Tempelruine", "Ein Tempel auf einer großen Insel mit hohen Säulenreihen, Kolossalstatuen und einem Altar. Drinnen versteckt sich eine Schatztruhe."], "es": ["Ruina de templo gigante", "Un templo en una isla grande con filas de columnas altas, estatuas colosales y un altar. Dentro se esconde un cofre del tesoro."], "ja": ["巨大な神殿の遺跡", "高い柱の列、巨人像、祭壇がある大きな島の神殿です。奥に宝箱が隠れています。"]}}, {"id": "lighthouse", "t": {"ko": ["등대의 밤", "해안의 등대가 밤마다 빛줄기로 바다를 돌며 비춰요."], "en": ["Lighthouse at Night", "The coastal lighthouse sweeps its beam over the sea every night."], "fr": ["Le phare la nuit", "Le phare de la côte balaie la mer de son faisceau chaque nuit."], "de": ["Leuchtturm bei Nacht", "Der Küstenleuchtturm lässt jede Nacht seinen Lichtstrahl über das Meer streichen."], "es": ["El faro de noche", "El faro de la costa barre el mar con su haz de luz cada noche."], "ja": ["夜の灯台", "海岸の灯台が、夜になると光の筋で海を回って照らします。"]}}, {"id": "volcano", "t": {"ko": ["화산 분출", "땅이 울린 뒤 화산재 기둥과 용암 덩어리가 솟아올라요."], "en": ["Volcano Eruption", "After the ground rumbles, an ash column and lava bombs shoot into the sky."], "fr": ["Éruption volcanique", "Après un grondement du sol, une colonne de cendres et des bombes de lave jaillissent."], "de": ["Vulkanausbruch", "Nach einem Beben steigen eine Aschesäule und Lavabomben empor."], "es": ["Erupción volcánica", "Tras el temblor del suelo, una columna de ceniza y bombas de lava salen disparadas."], "ja": ["火山の噴火", "地鳴りのあと、火山灰の柱と溶岩の塊が噴き上がります。"]}}, {"id": "skyisle", "t": {"ko": ["떠다니는 섬", "열기구를 타고 올라가면 구름 위에 폭포가 흐르는 섬이 떠 있어요."], "en": ["Floating Island", "Rise in the balloon and you will find islands with waterfalls floating above the clouds."], "fr": ["Île flottante", "En montgolfière, vous découvrez des îles à cascades flottant au-dessus des nuages."], "de": ["Schwebende Insel", "Im Ballon findest du über den Wolken schwebende Inseln mit Wasserfällen."], "es": ["Isla flotante", "Al subir en globo encontrarás islas con cascadas flotando sobre las nubes."], "ja": ["浮かぶ島", "気球で上がると、雲の上に滝の流れる島が浮かんでいます。"]}}, {"id": "skywhale", "t": {"ko": ["하늘 고래", "구름 위를 헤엄치는 거대한 고래의 그림자가 땅 위로 지나가요."], "en": ["Sky Whale", "The shadow of a huge whale swimming above the clouds passes over the land."], "fr": ["Baleine du ciel", "L'ombre d'une immense baleine nageant au-dessus des nuages glisse sur la terre."], "de": ["Himmelswal", "Der Schatten eines riesigen Wals über den Wolken zieht über das Land."], "es": ["Ballena del cielo", "La sombra de una enorme ballena que nada sobre las nubes pasa sobre la tierra."], "ja": ["空のクジラ", "雲の上を泳ぐ巨大なクジラの影が、大地の上を横切ります。"]}}, {"id": "parts", "t": {"ko": ["대형 건축 부품", "대형 기둥, 아치문, 첨탑, 석재벽돌로 지은 성문이에요."], "en": ["Large Building Parts", "A castle gate built from great pillars, archways, spires and stone bricks."], "fr": ["Grandes pièces de construction", "Une porte de château bâtie avec de grands piliers, des arches, des flèches et des briques de pierre."], "de": ["Große Bauteile", "Ein Burgtor aus großen Pfeilern, Torbögen, Turmspitzen und Steinziegeln."], "es": ["Piezas de construcción grandes", "Una puerta de castillo hecha con grandes pilares, arcos, agujas y ladrillos de piedra."], "ja": ["大型の建築パーツ", "大きな柱、アーチ門、尖塔、石レンガで建てた城門です。"]}}, {"id": "fossil", "t": {"ko": ["고래 뼈 화석", "사막 섬에 묻혀 있던 거대한 고래의 뼈예요."], "en": ["Whale Fossil", "The bones of a giant whale buried on a desert island."], "fr": ["Fossile de baleine", "Les os d'une baleine géante enfouis sur une île désertique."], "de": ["Wal-Fossil", "Die Knochen eines Riesenwals, begraben auf einer Wüsteninsel."], "es": ["Fósil de ballena", "Los huesos de una ballena gigante enterrados en una isla desértica."], "ja": ["クジラの化石", "砂漠の島に埋まっていた巨大なクジラの骨です。"]}}, {"id": "sunset", "t": {"ko": ["노을 해안", "붉게 물드는 해안선 위로 등대와 부두 짐이 서 있어요."], "en": ["Sunset Coast", "A lighthouse and dock cargo stand on the shoreline as the sky turns red."], "fr": ["Côte au coucher du soleil", "Un phare et des cargaisons de quai se dressent sur le rivage rougeoyant."], "de": ["Küste im Abendrot", "Ein Leuchtturm und Hafenladung stehen an der rot gefärbten Küste."], "es": ["Costa al atardecer", "Un faro y carga de muelle se alzan en la costa teñida de rojo."], "ja": ["夕焼けの海岸", "赤く染まる海岸線に、灯台と港の荷物が立っています。"]}}, {"id": "aurora", "t": {"ko": ["겨울밤 오로라", "겨울밤 하늘에 보라색과 초록색 오로라가 일렁여요."], "en": ["Winter Night Aurora", "Purple and green auroras ripple across the winter night sky."], "fr": ["Aurore d'une nuit d'hiver", "Des aurores violettes et vertes ondulent dans le ciel d'hiver."], "de": ["Polarlicht in der Winternacht", "Lila und grüne Polarlichter wogen am Winternachthimmel."], "es": ["Aurora de una noche de invierno", "Auroras moradas y verdes ondulan en el cielo de invierno."], "ja": ["冬の夜のオーロラ", "冬の夜空に、紫と緑のオーロラが揺らめきます。"]}}, {"id": "star", "t": {"ko": ["별똥별", "밤하늘을 가로지르는 별똥별이에요."], "en": ["Shooting Star", "A shooting star streaks across the night sky."], "fr": ["Étoile filante", "Une étoile filante traverse le ciel nocturne."], "de": ["Sternschnuppe", "Eine Sternschnuppe zieht über den Nachthimmel."], "es": ["Estrella fugaz", "Una estrella fugaz cruza el cielo nocturno."], "ja": ["流れ星", "夜空を横切る流れ星です。"]}}, {"id": "storm", "t": {"ko": ["폭풍의 번개", "폭풍이 치면 번개 줄기가 내리꽂히고 화면이 흔들려요."], "en": ["Storm Lightning", "In a storm, lightning bolts strike down and the screen shakes."], "fr": ["Éclair de tempête", "Pendant l'orage, les éclairs frappent et l'écran tremble."], "de": ["Gewitterblitz", "Bei Gewitter schlagen Blitze ein und der Bildschirm wackelt."], "es": ["Rayo de tormenta", "En una tormenta caen rayos y la pantalla tiembla."], "ja": ["嵐の稲妻", "嵐になると稲妻が落ち、画面が揺れます。"]}}, {"id": "dawn", "t": {"ko": ["새벽 안개", "해가 뜨기 전, 섬 위로 따뜻한 안개가 천천히 흘러요."], "en": ["Dawn Mist", "Before sunrise, a warm mist drifts slowly over the island."], "fr": ["Brume de l'aube", "Avant le lever du soleil, une brume chaude flotte lentement sur l'île."], "de": ["Morgennebel", "Vor Sonnenaufgang zieht ein warmer Nebel langsam über die Insel."], "es": ["Niebla del amanecer", "Antes del amanecer, una niebla cálida flota despacio sobre la isla."], "ja": ["明け方の霧", "日の出前、島の上を暖かい霧がゆっくり流れます。"]}}], "ui": {"title": {"ko": "갤러리", "en": "Gallery", "fr": "Galerie", "de": "Galerie", "es": "Galería", "ja": "ギャラリー"}, "sub": {"ko": "웅장한 풍경과 구조물을 모았어요. 사진을 누르면 크게 볼 수 있어요.", "en": "Grand landscapes and structures from the game. Tap a picture to enlarge it.", "fr": "Les grands paysages et structures du jeu. Touchez une image pour l'agrandir.", "de": "Große Landschaften und Bauwerke aus dem Spiel. Tippe ein Bild an, um es zu vergrößern.", "es": "Paisajes y estructuras grandiosos del juego. Toca una imagen para ampliarla.", "ja": "ゲームの壮大な風景と構造物を集めました。写真を押すと大きく見られます。"}, "back": {"ko": "← 사이트로", "en": "← Site", "fr": "← Site", "de": "← Seite", "es": "← Sitio", "ja": "← サイトへ"}, "play": {"ko": "게임 하러 가기", "en": "Play the game", "fr": "Jouer", "de": "Spiel starten", "es": "Jugar", "ja": "ゲームをする"}, "close": {"ko": "닫기", "en": "Close", "fr": "Fermer", "de": "Schließen", "es": "Cerrar", "ja": "閉じる"}, "prev": {"ko": "이전", "en": "Prev", "fr": "Préc.", "de": "Zurück", "es": "Ant.", "ja": "前へ"}, "next": {"ko": "다음", "en": "Next", "fr": "Suiv.", "de": "Weiter", "es": "Sig.", "ja": "次へ"}, "foot": {"ko": "모든 사진은 게임 화면을 그대로 찍은 거예요.", "en": "All pictures are straight from the game screen.", "fr": "Toutes les images viennent directement de l'écran du jeu.", "de": "Alle Bilder stammen direkt vom Spielbildschirm.", "es": "Todas las imágenes son capturas directas del juego.", "ja": "すべての写真はゲーム画面をそのまま撮ったものです。"}}};
const LS=['ko','en','fr','de','es','ja'],NAMES={ko:'한국어',en:'English',fr:'Français',de:'Deutsch',es:'Español',ja:'日本語'},KEY='beaconfallSiteLang';
function pick(){let s=null;try{s=localStorage.getItem(KEY);}catch(e){}
 if(s&&LS.includes(s))return s;
 for(const x of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'ko'])){const b=String(x).toLowerCase().split('-')[0];if(LS.includes(b))return b;}
 return 'en';}
let LANG=pick(),LI=-1;
const t=k=>{const e=G.ui[k];return (e&&(e[LANG]||e.ko))||'';};
const tr=it=>it.t[LANG]||it.t.ko;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function applyLang(){
 document.documentElement.lang=LANG;
 document.title='BEACONFALL · '+t('title');
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
 document.getElementById('lg').innerHTML=LS.map(l=>'<button class="pb'+(l===LANG?' on':'')+'" data-l="'+l+'">'+NAMES[l]+'</button>').join('');
 document.getElementById('grid').innerHTML=G.items.map((it,i)=>{const x=tr(it);return '<button class="card" data-i="'+i+'"><img loading="lazy" src="gallery/t-'+it.id+'.png" alt="'+esc(x[0])+'"><span class="cap"><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></span></button>';}).join('');
 if(LI>=0)show(LI);
}
const lb=document.getElementById('lb');
function show(i){
 LI=(i+G.items.length)%G.items.length;const it=G.items[LI],x=tr(it);
 document.getElementById('lbImg').src='gallery/'+it.id+'.png';document.getElementById('lbImg').alt=x[0];
 document.getElementById('lbT').textContent=x[0];document.getElementById('lbD').textContent=x[1];
 lb.classList.add('on');
}
function hide(){lb.classList.remove('on');LI=-1;}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){LANG=l.dataset.l;try{localStorage.setItem(KEY,LANG);if(window.FFLang)FFLang.set(LANG);}catch(x){}applyLang();return;}
 const c=e.target.closest('.card');if(c){show(+c.dataset.i);return;}
 if(e.target.id==='lbPrev'){show(LI-1);return;}
 if(e.target.id==='lbNext'){show(LI+1);return;}
 if(e.target.id==='lbClose'||e.target===lb){hide();}
});
document.addEventListener('keydown',e=>{if(LI<0)return;if(e.key==='Escape')hide();else if(e.key==='ArrowLeft')show(LI-1);else if(e.key==='ArrowRight')show(LI+1);});
applyLang();
</script>
</body>
</html>
